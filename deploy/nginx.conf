server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Le pendant nginx de `socket.setNoDelay(true)` côté node : sans lui,
    # l'algorithme de Nagle peut retenir une petite trame jusqu'à 40 ms. Sur un
    # buzzer, 40 ms c'est la différence entre le 1er et le 2e (PROMPT.md §3.4).
    tcp_nodelay on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # nginx ne connaît pas l'extension .webmanifest : sans ça le manifeste part
    # en application/octet-stream et Android ignore l'invite d'installation.
    # On surcharge le type sur ce seul fichier — un bloc `types` ici
    # remplacerait toute la table MIME héritée et casserait le CSS et le JS.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # ------------------------------------------------------------------ /ws
    # PIÈGE N°1 : nginx COUPE l'upgrade WebSocket par défaut. Sans ce bloc, tout
    # marche en local (Vite proxifie) et RIEN ne marche en prod : le navigateur
    # reçoit un 200 au lieu d'un 101 et la socket ne s'ouvre jamais.
    #
    # `/ws` est un préfixe plus long que `/` : nginx le choisit avant le bloc
    # SPA quel que soit l'ordre d'écriture des `location`. Il ne recoupe pas
    # `/api/`.
    location /ws {
        proxy_pass http://livebuzzer-api:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Une soirée dure plus d'une heure de silence applicatif possible : sans
        # ces timeouts, nginx coupe la socket à 60 s et le client passe sa vie à
        # se reconnecter.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Tamponner un flux temps réel, c'est le retarder. Et compresser des
        # messages de 60 octets, c'est payer du CPU pour ajouter de la latence.
        proxy_buffering off;
        gzip off;
    }

    # L'API tourne dans le conteneur voisin, sur le réseau Docker partagé.
    location /api/ {
        proxy_pass http://livebuzzer-api:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Assets fingerprintés par Vite : cache long.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA : /ZK4P et /m/ZK4P sont des routes client, pas des fichiers.
    location / {
        try_files $uri /index.html;
    }
}
